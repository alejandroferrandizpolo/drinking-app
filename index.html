<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contador de Fiesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1115;
    --bg-card: #171A21;
    --bg-card-hover: #1D2129;
    --line: #262B35;
    --text: #F0EAE0;
    --text-dim: #8B93A3;
    --chupito: #E8A33D;
    --cerveza: #F2C14E;
    --cubata: #8FBF5A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px 0;
  }

  header{
    padding: 32px 20px 20px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
    position: relative;
  }
  header h1{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(28px, 7vw, 40px);
    margin: 0;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  header .sub{
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 8px;
  }

  .totales{
    display:flex;
    gap: 18px;
    padding: 0 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .totales .t{
    display:flex;
    flex-direction: column;
    gap:2px;
  }
  .totales .t .n{
    font-family:'Archivo Black', sans-serif;
    font-size: 26px;
    line-height:1;
  }
  .totales .t .l{
    font-size:11px;
    color: var(--text-dim);
  }
  .t.chupito .n{color:var(--chupito);}
  .t.cerveza .n{color:var(--cerveza);}
  .t.cubata .n{color:var(--cubata);}

  main{
    display:flex;
    flex-direction: column;
    gap: 14px;
    padding: 0 16px;
    max-width: 640px;
    margin: 0 auto;
  }

  .persona{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px 8px;
  }
  .persona .nombre{
    font-family:'Archivo Black', sans-serif;
    font-size: 19px;
    margin-bottom: 14px;
    display:flex;
    align-items:center;
    justify-content: space-between;
  }
  .persona .nombre .total-persona{
    font-family:'Archivo', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-dim);
  }

  .contadores{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding-bottom: 14px;
  }

  .contador{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 8px;
  }
  .contador .icono{
    font-size: 20px;
  }
  .contador .etiqueta{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  .contador .valor{
    font-family:'Archivo Black', sans-serif;
    font-size: 30px;
    line-height:1;
    min-width: 2ch;
    text-align:center;
    transition: transform 0.15s ease;
  }
  .contador .valor.bump{
    transform: scale(1.25);
  }
  .contador .botones{
    display:flex;
    gap: 6px;
    width: 100%;
  }
  .contador button{
    flex:1;
    border: none;
    border-radius: 8px;
    height: 40px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    color: #0F1115;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  .contador button:active{
    transform: scale(0.92);
  }
  .contador button.minus{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
  }
  .contador.chupito .valor, .contador.chupito button.plus{background-color: var(--chupito); }
  .contador.chupito .valor{background:none; color:var(--chupito);}
  .contador.cerveza .valor{color:var(--cerveza);}
  .contador.cubata .valor{color:var(--cubata);}
  .contador.chupito button.plus{background: var(--chupito);}
  .contador.cerveza button.plus{background: var(--cerveza);}
  .contador.cubata button.plus{background: var(--cubata);}
  .contador button.plus:active{filter: brightness(0.85);}

  .estado{
    text-align:center;
    color: var(--text-dim);
    font-size: 12px;
    padding: 20px;
  }

  @media (min-width: 480px){
    .contador .valor{font-size: 34px;}
  }
</style>
</head>
<body>

<header>
  <h1>🍻 Contador de Fiesta</h1>
  <div class="sub">Chupitos, cervezas y cubatas — en directo</div>
</header>

<div class="totales" id="totales">
  <div class="t chupito"><span class="n" id="total-chupito">0</span><span class="l">Chupitos</span></div>
  <div class="t cerveza"><span class="n" id="total-cerveza">0</span><span class="l">Cervezas</span></div>
  <div class="t cubata"><span class="n" id="total-cubata">0</span><span class="l">Cubatas</span></div>
</div>

<main id="lista">
  <div class="estado">Cargando...</div>
</main>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, onValue, set, get, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  // ⚠️ SUSTITUYE ESTO por tu propia configuración de Firebase (ver instrucciones)
  const firebaseConfig = {
    apiKey: "AIzaSyC1iwz2UglvJWykoIkI5unbvrjZTM_F_zY",
    authDomain: "la-banda-del-peugeot.firebaseapp.com",
    databaseURL: "https://la-banda-del-peugeot-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "la-banda-del-peugeot",
    storageBucket: "la-banda-del-peugeot.firebasestorage.app",
    messagingSenderId: "687126020735",
    appId: "1:687126020735:web:b9e03ebcc4714724c5754a",
    measurementId: "G-YWF40C8N53"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Lista fija de personas
  const PERSONAS = ["Selva", "Fabro", "Lima", "Alejandro", "Carlitos", "Juan Edu", "Lajara", "Illidge", "Sergio"];
  const BEBIDAS = [
    {key: "chupito", label: "Chupitos", icono: "🥃"},
    {key: "cerveza", label: "Cervezas", icono: "🍺"},
    {key: "cubata",  label: "Cubatas",  icono: "🍸"}
  ];

  const lista = document.getElementById("lista");

  function slug(nombre){
    return nombre.toLowerCase().replace(/\s+/g, "_").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  // Construir UI
  lista.innerHTML = "";
  PERSONAS.forEach(nombre => {
    const id = slug(nombre);
    const card = document.createElement("div");
    card.className = "persona";
    card.innerHTML = `
      <div class="nombre">
        <span>${nombre}</span>
        <span class="total-persona" id="total-${id}">0 en total</span>
      </div>
      <div class="contadores">
        ${BEBIDAS.map(b => `
          <div class="contador ${b.key}">
            <div class="icono">${b.icono}</div>
            <div class="etiqueta">${b.label}</div>
            <div class="valor" id="valor-${id}-${b.key}">0</div>
            <div class="botones">
              <button class="minus" data-id="${id}" data-bebida="${b.key}" data-delta="-1">−</button>
              <button class="plus" data-id="${id}" data-bebida="${b.key}" data-delta="1">+</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
    lista.appendChild(card);
  });

  // Delegación de eventos para los botones
  lista.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if(!btn) return;
    const { id, bebida, delta } = btn.dataset;
    const counterRef = ref(db, `contadores/${id}/${bebida}`);
    runTransaction(counterRef, (actual) => {
      const nuevo = (actual || 0) + parseInt(delta, 10);
      return nuevo < 0 ? 0 : nuevo;
    });
  });

  // Escuchar cambios en tiempo real
  const rootRef = ref(db, "contadores");
  onValue(rootRef, (snapshot) => {
    const data = snapshot.val() || {};
    let totalChupito = 0, totalCerveza = 0, totalCubata = 0;

    PERSONAS.forEach(nombre => {
      const id = slug(nombre);
      const personaData = data[id] || {};
      let totalPersona = 0;
      BEBIDAS.forEach(b => {
        const val = personaData[b.key] || 0;
        const el = document.getElementById(`valor-${id}-${b.key}`);
        if(el){
          if(el.textContent !== String(val)){
            el.textContent = val;
            el.classList.add("bump");
            setTimeout(() => el.classList.remove("bump"), 150);
          }
        }
        totalPersona += val;
        if(b.key === "chupito") totalChupito += val;
        if(b.key === "cerveza") totalCerveza += val;
        if(b.key === "cubata") totalCubata += val;
      });
      const totalEl = document.getElementById(`total-${id}`);
      if(totalEl) totalEl.textContent = `${totalPersona} en total`;
    });

    document.getElementById("total-chupito").textContent = totalChupito;
    document.getElementById("total-cerveza").textContent = totalCerveza;
    document.getElementById("total-cubata").textContent = totalCubata;
  });
</script>

</body>
</html>
